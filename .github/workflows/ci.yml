name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - run: python -m scripts.evaluate
      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-evaluation
          path: evaluation/results.json
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: npm ci && npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          cd web
          npm start -- --hostname 0.0.0.0 &
          for i in $(seq 1 30); do curl -fsS http://localhost:3000 && break || sleep 2; done
          npx playwright test
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d
      - run: |
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/health && break || sleep 2; done
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:3000
      - if: always()
        run: docker compose down
  deploy-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile -t rag-demo .
      - run: |
          docker run -d -p 8080:10000 -e PORT=10000 --name rag-demo rag-demo
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/health && break || sleep 2; done
          curl -fsS http://localhost:8080/ | grep -q 'public demo'
          curl -fsS -X POST http://localhost:8080/ask -H 'Content-Type: application/json' \
            -d '{"question":"What human oversight is required for high-risk AI systems?"}' | grep -q trace_id
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/ask -H 'Content-Type: application/json' -d '{"question":"human oversight","mode":"ollama"}')" = 400
          curl -fsS http://localhost:8080/metrics | grep -q 'rag_requests_total{mode="extractive",outcome="answered"} 1.0'
      - if: always()
        run: docker logs rag-demo
